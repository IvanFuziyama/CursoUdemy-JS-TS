<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários e Inputs</title>
    <style>
        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        label[for="nome"]{
            cursor: pointer;
            display: block;
        }
    </style>
</head>
<body>
    <form action="#" method="get" target="_blank" autocomplete="off">
        <p>O meu formulário</p>
        <p>
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="nome" placeholder="Seu nome" required>
        </p>
        <p>
            <label for="selecionar">Você é humano?</label>
            <input type="checkbox" name="selecao" id="selecao" value="sim">
        </p>
        <p>
            Gênero:<br> 
            <label for="masculino">Masculino</label>
            <input type="radio" name="genero" id="masculino" value="masculino"><br>
            <label for="feminino">Feminino</label>
            <input type="radio" name="genero" id="feminino" value="feminino"><br>
            <label for="outro">Outro</label>
            <input type="radio" name="genero" id="outro" value="outro"><br>
        </p>
        <p>
            <label for="data">Data</label>
            <input type="date" name="data" id="data">
        </p>
        <p>
            <label for="data-tempo">Data e Hora</label>
            <input type="datetime-local" name="data-tempo" id="data-tempo">
        </p>
        <p>
            <label for="hora">Horário</label>
            <input type="time" name="hora" id="hora" value="00:00">
        </p>
        <p>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="email@email.com">
        </p>
        <p>
            <label for="file">Arquivo</label>
            <input type="file" name="file" id="file" accept=".jpg">
        </p>
        <p>
            <label for="number">Número:</label>
            <input type="number" name="number" id="number" placeholder="Digite um número:" min="10" max="50">
        </p>
        <p>
            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha" placeholder="Digite sua senha:">
        </p>
        <p>
            <label for="select">Selecione uma opção:</label>
            <select name="select" id="select">
                <option value="qualquer1">Valor</option>
                <option value="qualquer2">seila</option>
            </select>
        </p>
        <p>
            <label for="texto-area">Observação</label>
            <textarea name="texto-area" id="texto-area"></textarea>
        </p>
        <p>
            <button type="reset">Reiniciar</button>
            <button type="submit">Enviar</button>
        </p>
    </form>
</body>
</html>
